<!DOCTYPE html>
<html>
	<head>
		<script src="/js/lib/jquery-2.2.4.min.js"></script>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width">

		<title>Log in with Discord</title>

		<link rel="stylesheet" href="//pokemonshowdown.com/style/global.css">
	</head>
	<body>
		<div class="body">
		<div class="main"><section class="section">
			<h2>Log in with Discord</h2><hr />
			<div class="infobox">
				<div id="status">Logging in...</div>
				<form id="signup" style="display:none">
					<h3>Pick your <b>permanent</b> base username</h3>
					<p style="border-left: 4px solid #cc8800; background: rgba(204, 136, 0, .1); padding: 8px 12px; margin: 10px 0">
						<strong>
							This is your base username but you can still nickname yourself while logged in on the same account.
						</strong>
					</p>
					<p class="error" id="error" style="display:none"></p>
					<p><label class="label">
						Username: <input class="textbox" type="text" name="username" maxlength="18" autocomplete="username" />
					</label></p>
					<p class="buttonbar">
						<button type="submit" class="button greenbutton"><strong>Create account</strong></button>
					</p>
				</form>
			</div>
		</section></div>
	</div>

	<div id="data" data-username="{{username}}" data-assertion="{{assertion}}"
		data-ticket="{{ticket}}" data-suggestion="{{suggestion}}"></div>

	<script>
		var safeJSON = function (callback) {
			return function (data) {
				if (data.length < 1) return;
				if (data[0] == ']') data = data.substr(1);
				try {
					return callback(JSON.parse(data));
				} catch {
					return callback({data: data});
				}
			};
		};
		var pageData = document.getElementById('data').dataset;
		var statusEl = document.getElementById('status');
		var signupEl = document.getElementById('signup');
		var errorEl = document.getElementById('error');

		function stop(message) {
			statusEl.style.display = '';
			statusEl.textContent = message;
			signupEl.style.display = 'none';
		}

		function finish(username, assertion) {
			if (!window.opener) {
				return stop("Logged in as " + username + ". You can close this window and reload Pokémon Showdown.");
			}
			window.opener.postMessage({
				type: 'discord-login', username: username, assertion: assertion,
			}, location.origin);
			window.close();
			stop("Logged in as " + username + ". You can close this window.");
		}

		function showSignup(error) {
			statusEl.style.display = 'none';
			signupEl.style.display = '';
			errorEl.textContent = error;
			errorEl.style.display = error ? '' : 'none';
			signupEl.username.focus();
			signupEl.username.select();
		}

		function register(ev) {
			ev.preventDefault();
			$.post('/api/discord/api/register', {
				ticket: pageData.ticket,
				username: ev.target.username.value,
			}, safeJSON(function (result) {
				if (result.actionerror) return showSignup(result.actionerror);
				finish(result.curuser.username, result.assertion);
			})).fail(function () {
				showSignup("The login server could not be reached. Please try again.");
			});
		}

		if (pageData.assertion) {
			finish(pageData.username, pageData.assertion);
		} else {
			signupEl.addEventListener('submit', register);
			signupEl.username.value = pageData.suggestion;
			showSignup('');
		}
	</script>

</body></html>
